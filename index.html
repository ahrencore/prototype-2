<title>Olympus Merge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Marcellus&display=swap">
<style>
/* Layout concept: a tabletop seen from above. Orders sit on top, the merge board is a marble slab,
   workshops and an altar line the bottom edge. Sites, store, album and the Divine Games board sit beside it
   (as tabs on phones). */
:root{
  --paper:#f2e8cf; --panel:#f9f2de; --text:#283618; --soft:#5d6a47; --edge:#283618;
  --board:#dccfa9; --slot:#ede1c0; --slot-edge:#c4b27f; --shadow:rgba(40,54,22,.22); --btn-text:#fff8e8;
  /* illustration colours stay the same in both themes */
  --line:#283618; --tomato:#bc4749; --plum:#6d597a; --leaf:#a7c957; --leaf-deep:#6f9a3a;
  --gold:#d9a21b; --amber:#e3a23a; --marble:#f1ead9; --cream:#fffaf0; --tan:#d9bf86; --wood:#a9743f;
  --sky:#9cc3cf; --slate:#8794ad; --teal:#4f9d9a; --wine:#8d3b5c; --tile:#f6eed7; --grass:#cfe0a0;
  --display:'Marcellus','Trajan Pro',Georgia,serif;
  --body:'Alegreya Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121a0b; --panel:#1c2812; --text:#f2e8cf; --soft:#b4bd98; --edge:#5b7040;
    --board:#2a3a1c; --slot:#18220f; --slot-edge:#3d5128; --shadow:rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121a0b; --panel:#1c2812; --text:#f2e8cf; --soft:#b4bd98; --edge:#5b7040;
  --board:#2a3a1c; --slot:#18220f; --slot-edge:#3d5128; --shadow:rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background-color:var(--paper);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .2  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.3'/></svg>");
  color:var(--text); font-family:var(--body); font-size:16px; line-height:1.35;
}
button{font:inherit;color:inherit}
.app{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:14px 28px;display:grid;gap:14px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px}
.brand{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,36px);letter-spacing:.04em;margin:0;text-wrap:balance}
.stats{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.lvl{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;min-width:0;flex:1 1 220px}
.lvl-n{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.xpbar{height:12px;border:2px solid var(--edge);border-radius:8px;background:var(--slot);overflow:hidden;min-width:70px}
.xpbar i{display:block;height:100%;width:0;background:var(--leaf);transition:width .4s}
.xptxt{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.pill{display:flex;align-items:center;gap:6px;padding:5px 11px;border:2px solid var(--edge);border-radius:999px;background:var(--panel);font-weight:800;font-variant-numeric:tabular-nums}
.pill small{font-weight:500;color:var(--soft);font-size:12px}
.pill.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.12)}}
.mi{width:18px;height:18px;vertical-align:-3px;flex:none}

.tabs{display:none;gap:6px}
.tab,.stab{padding:9px 6px;border:2px solid var(--edge);border-radius:8px;background:var(--panel);font-weight:800;letter-spacing:.05em;text-transform:uppercase;font-size:12px;cursor:pointer;flex:1}
.tab,.stab,.album-cover{position:relative}.has-dot::after,.album-cover.has-dot::after{content:'';position:absolute;top:7px;right:7px;width:10px;height:10px;border-radius:50%;background:#e63946;border:2px solid #fff;box-shadow:0 1px 0 var(--shadow)}
.card-pop{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.36);z-index:130;padding:18px}.card-pop[hidden]{display:none!important}.card-pop-box{width:min(92vw,360px);display:grid;gap:10px;background:var(--panel);border:3px solid var(--gold);border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);text-align:center}.card-pop-box h3{margin:0;font-family:var(--display);font-weight:400;font-size:28px}.card-pop-box p{margin:0;color:var(--soft)}.card-pop-art{display:grid;justify-items:center;gap:8px;background:var(--slot);border:2px solid var(--slot-edge);border-radius:14px;padding:12px}.card-pop-art .por{width:96px;height:96px}.card-pop-tag{display:inline-flex;align-items:center;justify-content:center;padding:4px 10px;border:2px solid var(--edge);border-radius:999px;background:var(--tile);font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}.card-pop-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.tab[aria-pressed="true"],.stab[aria-pressed="true"]{background:var(--text);color:var(--paper)}
.stabs{display:flex;gap:6px}
.stab{font-size:13px;padding:8px 10px}

.layout{display:grid;grid-template-columns:minmax(0,500px) minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--panel);border:2px solid var(--edge);border-radius:8px;padding:14px;box-shadow:3px 3px 0 var(--shadow);display:grid;gap:12px;min-width:0}
.label{font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--soft);margin:0}
.h{font-family:var(--display);font-weight:400;font-size:24px;margin:0;letter-spacing:.03em}
.sub{margin:0;color:var(--soft)}

/* illustration helpers */
.s{stroke:var(--line);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.l{stroke:var(--line);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.leaf{fill:var(--leaf)}.dleaf{fill:var(--leaf-deep)}.gold{fill:var(--gold)}.amber{fill:var(--amber)}
.tom{fill:var(--tomato)}.plum{fill:var(--plum)}.pap{fill:#fbf4e0}.mar{fill:var(--marble)}.cream{fill:var(--cream)}
.tan{fill:var(--tan)}.wood{fill:var(--wood)}.sky{fill:var(--sky)}.wine{fill:var(--wine)}.pink{fill:#f2c1b4}.none{fill:none}
.rk1{fill:#d8d1bf}.rk2{fill:#c6bda7}.rk3{fill:#a79f8c}.cl{fill:#fffdf5}
.bg.grass{fill:var(--grass)}.bg.skyw{fill:#a9cfdb}
.st-wood{stroke:var(--wood)}.st-gold{stroke:var(--gold)}.st-tom{stroke:var(--tomato)}.st-tan{stroke:var(--tan)}.st-pap{stroke:#fbf4e0}
.gl{stroke:var(--gold)}.fade{opacity:.35}
.glow{fill:var(--gold);opacity:.24;stroke:none}
.ico,.por,.scene-wob{filter:url(#ink)}
.ico{display:block}

/* orders */
.orders{display:grid;gap:8px}
.order-active{display:grid;grid-template-columns:72px minmax(0,1fr);grid-template-areas:"who say" "reqs reqs" "act act";gap:8px 12px;align-items:center;
  padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--tile);color:#283618;box-shadow:0 3px 0 var(--line);transition:transform .15s}
.order-active.divine{background:color-mix(in srgb,var(--gold) 22%,var(--tile));border-width:3px}
.order-active.enter{animation:enter .45s cubic-bezier(.3,1.4,.5,1)}
.order-active.over{outline:3px solid var(--gold)}
.order-active.shake{animation:shake .35s}
@keyframes enter{from{transform:translateX(26px);opacity:0}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.who{grid-area:who;display:grid;justify-items:center;gap:2px;font-family:var(--display);font-size:15px;text-align:center}
.who .por{width:60px;height:60px}
.say{grid-area:say;margin:0;font-size:16px;line-height:1.25;min-width:0}
.tag{display:inline-block;font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--plum);color:#fff8e8;padding:1px 8px;border-radius:999px;font-family:var(--body)}
.tag.div{background:var(--gold);color:#283618}
.reqs{grid-area:reqs;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.req{display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:700;width:76px;text-align:center;line-height:1.1;position:relative}
.mini{width:60px;height:60px;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--chain) 26%,var(--tile));position:relative}
.mini .ico{width:50px;height:50px}
.req.done .mini{opacity:.5;border-style:solid;border-color:var(--leaf-deep)}
.req.done span{text-decoration:line-through;opacity:.6}
.tick{position:absolute;right:-6px;top:-6px;width:22px;height:22px;opacity:1!important}
.act{grid-area:act;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.rw{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.rw>span{display:flex;gap:4px;align-items:center}
.rw .xp{font-weight:700;color:#5d6a47}
.btns{display:flex;gap:8px;align-items:center}
.next{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border:2px solid var(--edge);border-radius:999px;background:var(--panel);font-size:13px;font-weight:700}
.chip .por{width:28px;height:28px}
.chip .ico{width:22px;height:22px}

.btn{font-weight:800;font-size:15px;padding:9px 14px;border:2px solid var(--line);background:var(--tomato);color:var(--btn-text);border-radius:8px;box-shadow:0 3px 0 var(--line);cursor:pointer;min-height:42px}
.btn.alt{background:var(--tile);color:#283618}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn:disabled{background:var(--slot);color:var(--soft);border:2px dashed var(--slot-edge);box-shadow:none;cursor:default}
.btn .mi{width:16px;height:16px}
.btn:focus-visible,.tab:focus-visible,.stab:focus-visible,.gen:focus-visible,.slot:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* board */
.boardwrap{width:100%}
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;padding:7px;background:var(--board);border:2px solid var(--edge);border-radius:10px;touch-action:none;
  box-shadow:inset 0 3px 10px var(--shadow)}
.slot{position:relative;aspect-ratio:1;background:var(--slot);border:2px dashed var(--slot-edge);border-radius:12px;user-select:none;-webkit-user-select:none}
.slot.over{background:color-mix(in srgb,var(--gold) 32%,var(--slot))}
.item{position:absolute;inset:2px;display:grid;place-items:center;border:2px solid var(--line);border-radius:11px;
  background:color-mix(in srgb,var(--chain) 26%,var(--tile));box-shadow:0 2px 0 var(--line);cursor:grab;transition:transform .12s,box-shadow .12s}
.item .ico{width:80%;height:80%;margin-bottom:7px;pointer-events:none}
.slot.sel .item{transform:translateY(-3px);box-shadow:0 5px 0 var(--line)}
.slot.lifted .item{opacity:.22}
.item.wanted{outline:3px solid var(--gold);outline-offset:1px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{outline-color:transparent}}
.item.top{background:color-mix(in srgb,var(--gold) 38%,var(--tile))}
.item.pop{animation:pop .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.pips{position:absolute;bottom:4px;left:0;right:0;display:flex;gap:2px;justify-content:center;pointer-events:none}
.pips i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.item.top .pips i{background:var(--gold);border:1px solid var(--line)}
.pt{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--c);pointer-events:none;animation:fly .7s ease-out forwards;z-index:3}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;border:2px solid var(--line);border-radius:12px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--chain) 26%,var(--tile));box-shadow:0 10px 18px var(--shadow)}
.ghost .item{position:static;inset:auto;border:0;box-shadow:none;background:none;width:100%;height:100%;animation:none;outline:0}
.hint{margin:0;min-height:2.6em;color:var(--soft);font-size:15px}

/* workshops */
.gens{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.gen,.altar{display:grid;justify-items:center;align-content:start;gap:3px;padding:8px 4px;border:2px solid var(--line);border-radius:12px;min-width:0;text-align:center;line-height:1.1}
.gen{background:color-mix(in srgb,var(--chain) 30%,var(--tile));color:#283618;box-shadow:0 3px 0 var(--line);cursor:pointer}
.gen:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.gen:disabled{opacity:.5;cursor:default}
.gen.locked{opacity:.55;filter:grayscale(.75);box-shadow:none;border-style:dashed}
.gen .ico,.altar .ico{width:40px;height:40px}
.gn{font-weight:800;font-size:13px}
.cost{display:flex;gap:3px;align-items:center;font-weight:800;font-size:13px}
.cost .mi{width:14px;height:14px}
.altar{border:2px dashed var(--edge);background:transparent}
.altar.over{background:color-mix(in srgb,var(--gold) 32%,transparent)}
.altar .sub{font-size:12px}

/* side panel */
.side{align-content:start}
.sites-list{display:grid;gap:12px}
.site{display:grid;gap:10px;grid-template-columns:minmax(0,1fr);padding-top:12px;border-top:2px dashed var(--slot-edge)}
.site:first-of-type{border-top:0;padding-top:0}
.scene{width:100%;height:auto;display:block;border:2px solid var(--line);border-radius:8px;background:#cfe0a0;overflow:hidden;aspect-ratio:320/200}
.site-info{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.site-info h3,.prod h3,.set h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.stage{margin:0;color:var(--soft)}
.steps{display:flex;gap:5px;margin-top:4px}
.steps i{width:22px;height:8px;border:2px solid var(--edge);border-radius:4px;background:var(--slot)}
.steps i.on{background:var(--leaf)}
.done{font-weight:800;color:var(--leaf-deep);letter-spacing:.04em}
.next-up{font-size:13px;color:var(--soft);margin:0}

.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.prod{display:grid;gap:6px;justify-items:center;align-content:start;text-align:center;padding:12px 10px;border:2px solid var(--edge);border-radius:10px;background:var(--panel)}
.prod.free{background:color-mix(in srgb,var(--leaf) 25%,var(--panel))}
.prod .ico{width:54px;height:54px}
.prod h3{font-size:17px}
.prod p{margin:0;color:var(--soft);font-size:14px;line-height:1.2}

.set{display:grid;gap:8px;padding-top:12px;border-top:2px dashed var(--slot-edge)}
.set:first-of-type{border-top:0;padding-top:0}
.set-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
.set-head p{margin:0;color:var(--soft);font-size:14px}

function drop(from,to){
  var a=S.board[from],b=S.board[to];
  if(from===to||!a||a.gen)return 'none';

  if(!b){S.board[to]=a;S.board[from]=null;return 'move'}
  if(a.c===b.c&&a.t===b.t&&a.t<MAXT){S.board[to]={c:a.c,t:a.t+1,id:S.uid++};S.board[from]=null;S.stats.merges++;return 'merge'}

}

var RK={state:'loading',all:[],me:null,canWrite:true,ver:0,names:{}};
var NET=null, pushTimer=null, pushing=false, lastPushed='', slim=false;
function rollCycle(){
  var cur=cycleNow(),c=S.comp;
  if(c.cycle===cur)return false;
  if(c.cycle===cur-1){c.lastCycle=c.cycle;c.lastPoints=c.points}
  else{c.lastCycle=null;c.lastPoints=0}
  c.cycle=cur;c.points=0;save();pushScore();return true;
}
function myPointsFor(cy){var c=S.comp;return c.cycle===cy?c.points:(c.lastCycle===cy?c.lastPoints:0)}
function cleanDoc(d){
  return {id:d.id,cycle:d.cycle,points:+d.points||0,lastCycle:d.lastCycle,lastPoints:+d.lastPoints||0,
    name:typeof d.name==='string'?cleanName(d.name):'',av:(typeof d.av==='string'&&CHAR[d.av])?d.av:'g0',frame:(typeof d.frame==='string'&&FR[d.frame])?d.frame:'plain'};
}
function docFor(id){var d=null;RK.all.forEach(function(x){if(x.id===id)d=x});return d?cleanDoc(d):null}
function scoresFor(cy){
  var rows=[],seenMe=false;
  RK.all.forEach(function(d0){
    var d=cleanDoc(d0),pts=d.cycle===cy?d.points:(d.lastCycle===cy?d.lastPoints:0);
    if(RK.me&&d.id===RK.me){pts=myPointsFor(cy);seenMe=true}
    if(pts>0)rows.push({id:d.id,pts:pts});
  });
  var mine=myPointsFor(cy);
  if(!seenMe&&mine>0)rows.push({id:RK.me||'me',pts:mine});
  rows.sort(function(a,b){return b.pts-a.pts});
  return rows;
}
function roundPrize(place){
  if(place===1)return {coins:400,gems:25,label:'1st'};
  if(place&&place<=3)return {coins:250,gems:15,label:'Top 3'};
  if(place&&place<=10)return {coins:120,gems:0,label:'Top 10'};
  return {coins:40,gems:0,label:'Played'};
}
function claimRound(){
  var cur=cycleNow(),prev=cur-1,pts=myPointsFor(prev);
  if(S.comp.claimed>=prev)return;
  if(pts<=0){S.comp.claimed=prev;toast('You skipped that round, so no prize. Next one is yours.');save();render();return}
  var rows=scoresFor(prev),place=null,i;
  if(RK.state==='ready'&&RK.me){for(i=0;i<rows.length;i++)if(rows[i].id===RK.me){place=i+1;break}}
  var pr=roundPrize(place),fm='';
  S.comp.claimed=prev;S.coins+=pr.coins;S.gems+=pr.gems;
  if(place===1){S.frames.champion=1;S.frames.podium=1;fm=' New frame: '+FR.champion.name+'.'}
  else if(place&&place<=3){S.frames.podium=1;fm=' New frame: '+FR.podium.name+'.'}
  toast('Round '+(prev+1)+' prize ('+pr.label+'): +'+pr.coins+' coins'+(pr.gems?', +'+pr.gems+' gems':'')+'.'+(place?' You placed #'+place+'.':'')+fm);
  save();render();
}
function pushScore(now){
  if(!NET||!NET.mine||!RK.canWrite)return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(doPush,now?300:1500);
}
function doPush(){
  if(!NET||pushing)return;
  var c=S.comp,body={cycle:c.cycle,points:c.points,lastCycle:c.lastCycle,lastPoints:c.lastPoints,level:S.level};
  if(!slim){body.name=S.profile.name;body.av=S.profile.av;body.frame=S.profile.frame}
  var s=JSON.stringify(body);
  if(s===lastPushed)return;
  pushing=true;
  NET.mine.set(body).then(function(){lastPushed=s;pushing=false},function(e){
    pushing=false;
    if(e&&e.code==='invalid_argument'){
      if(!slim){slim=true;pushScore(true)}else{RK.canWrite=false;bumpRank()}
    }
  });
}
function bumpRank(){RK.ver++;if(side==='rank'&&(view!=='merge'||window.innerWidth>=900))renderSide()}
function initNet(){
  var cl=window.claude;
  if(!cl||!cl.use){RK.state='none';bumpRank();return}
  Promise.all([cl.use('db'),cl.use('user')]).then(function(r){
    var db=r[0],user=r[1];
    if(!db||!user){RK.state='none';bumpRank();return}
    return user.id().then(function(id){
      if(!id){RK.state='none';bumpRank();return}
      RK.me=id;
      NET={db:db,user:user,col:db.collection('players'),mine:db.collection('players').doc(id)};
      return user.can('data.write').then(function(ok){
        if(ok===false)RK.canWrite=false;
        NET.col.limit(300).onSnapshot(function(snap){
          RK.all=snap.docs.map(function(d){var x=d.data()||{};x.id=d.id;return x});
          RK.state='ready';bumpRank();
        },function(){RK.state='none';bumpRank()});
        pushScore();
      });
    });
  }).catch(function(){RK.state='none';bumpRank()});
}

function tapSlot(i){
  var it=S.board[i];
  if(it&&it.gen){sel=null;summon(it.gen);return}
  if(sel===null){
    if(it){sel=i;$('#hint').textContent=tierName(it.c,it.t)+' (tier '+it.t+' of '+MAXT+'). '+(it.t<MAXT?'Tap a matching item to make '+tierName(it.c,it.t+1)+'.':'Top tier. Deliver it to a god.')}
  }else if(sel===i){sel=null}
  else{var from=sel;sel=null;var r=drop(from,i);afterDrop(r,i);return}
  renderBoard();
}
function handleDrop(from,t){
  if(S.board[from]&&S.board[from].gen){summon(S.board[from].gen);return}
  var k=t.dataset.drop;
  sel=null;
  if(k==='slot'){var to=+t.dataset.i;if(to===from){renderBoard();return}afterDrop(drop(from,to),to)}
  else if(k==='order'){
    if(!deliver(from)){t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake');toast('That is not what '+GODS[S.orders[0].g].n+' asked for.');renderBoard()}
  }
  else if(k==='altar'){offer(from)}
}
function endDrag(){
  window.removeEventListener('pointermove',onMove);window.removeEventListener('pointerup',onUp);window.removeEventListener('pointercancel',onCancel);
  if(ghost){ghost.remove();ghost=null}
  slots.forEach(function(s){s.classList.remove('lifted')});
  overEl=null;
  var over=document.querySelectorAll('.over');for(var i=0;i<over.length;i++)over[i].classList.remove('over');
  drag=null;
}

function hover(e){
  var el=document.elementFromPoint(e.clientX,e.clientY),t=el&&el.closest?el.closest('[data-drop]'):null;
  if(t!==overEl){if(overEl)overEl.classList.remove('over');overEl=t;if(t&&t!==slots[drag.i])t.classList.add('over')}
}
function onMove(e){
  if(!drag||e.pointerId!==drag.id)return;
  var dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
  if(!drag.moved&&Math.hypot(dx,dy)>6){
    drag.moved=true;sel=null;
    ghost=document.createElement('div');ghost.className='ghost';ghost.style.width=drag.w+'px';ghost.style.height=drag.w+'px';
    ghost.style.setProperty('--chain','var('+CH[S.board[drag.i].c].var+')');
    ghost.innerHTML=slots[drag.i].innerHTML;document.body.appendChild(ghost);
    slots[drag.i].classList.add('lifted');slots.forEach(function(s){s.classList.remove('sel')});
  }
  if(drag.moved){moveGhost(e);hover(e)}
}
function onUp(e){
  if(!drag||e.pointerId!==drag.id)return;
  var from=drag.i,moved=drag.moved,el=document.elementFromPoint(e.clientX,e.clientY),t=el&&el.closest?el.closest('[data-drop]'):null;
  endDrag();
  if(!moved){tapSlot(from);return}
  if(S.board[from]&&S.board[from].gen){summon(S.board[from].gen);return}
  if(!t){renderBoard();return}

function fitMobileBoard(){
 if(!window.matchMedia||!window.matchMedia('(max-width:899px)').matches)return;
 var wrap=document.querySelector('.boardwrap'),b=document.getElementById('board');
 if(!wrap||!b||!wrap.clientWidth||!wrap.clientHeight)return;
 var cs=getComputedStyle(b),gap=parseFloat(cs.columnGap)||3,pad=2*(parseFloat(cs.paddingLeft)||4),border=2*(parseFloat(cs.borderLeftWidth)||2);
 var availableWidth=wrap.clientWidth-2,availableHeight=wrap.clientHeight-2;
 var cols=6,rows=8;
 // Exactly fit 6x8 square board cells within the actual remaining viewport.
 var cell=Math.min((availableWidth-pad-border-gap*(cols-1))/cols,(availableHeight-pad-border-gap*(rows-1))/rows);
 if(cell<=0)return;
 var width=Math.floor(cell*cols+pad+border+gap*(cols-1));
 var height=Math.floor(cell*rows+pad+border+gap*(rows-1));
 b.style.setProperty('--board-fit-w',width+'px');
 b.style.setProperty('--board-fit-h',height+'px');
}
